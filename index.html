<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The layout is built for the width of the device, so page zoom is off
         everywhere. This tag covers Android and desktop; iOS Safari ignores
         user-scalable, and is handled in src/lib/zoom.ts. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light" />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Added to the Home Screen, this opens without Safari's address bar. The
         manifest covers Android and modern iOS; the apple-* tags cover older
         iOS, which ignores the manifest's display mode. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#10211e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Directory" />
    <!--
      Translucent, which puts the app's own bar under the status bar. It costs
      something and the app pays it deliberately: iOS lays a translucent
      standalone app out from the top of the screen but reports a viewport one
      status bar shorter, so anything anchored to the bottom stops that far up
      the screen. Measured on a 15 Pro Max - 932pt of glass, the app ending at
      872.67, the missing 59.33 exactly the top inset it is told to pad by.

      Switching to opaque fixes the arithmetic and cannot fix an installed
      app: iOS reads this tag when the icon is added to the Home Screen and
      bakes it in, so a phone that installed the app while it said translucent
      goes on being translucent whatever this file says later. That is not a
      thing a deploy can reach. The stylesheet gives the height back instead -
      see the standalone block - which works on every install, old or new.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!--
      Delivered as a meta tag rather than only in public/_headers so it applies
      wherever the app is served - dev server, local preview, any host - not just
      Cloudflare. There are no inline scripts, so script-src stays strict;
      style-src needs 'unsafe-inline' because React sets style attributes.
      img-src allows blob:/data: for photo previews drawn on a canvas.
      frame-ancestors is header-only, so it lives in public/_headers instead.

      Self-hosting Supabase? Replace https://*.supabase.co with your own origin.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self';
               style-src 'self' 'unsafe-inline';
               img-src 'self' data: blob: https://*.supabase.co;
               font-src 'self';
               connect-src 'self' https://*.supabase.co wss://*.supabase.co;
               object-src 'none';
               base-uri 'self';
               form-action 'self'"
    />
    <title>Church Directory</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f6d63'/%3E%3Cpath d='M14 6h4v6h6v4h-6v10h-4V16H8v-4h6z' fill='white'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
