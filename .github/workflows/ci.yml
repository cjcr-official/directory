name: Build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Renders the sample book, which fails the build if the layout engine
      # throws on a real end-to-end run.
      - name: Render the sample directory
        run: npm run sample:pdf -- /tmp/sample-directory.pdf

      # Every one of these is pure - no database, no browser, milliseconds each
      # - and every one covers something that goes wrong without throwing: a
      # record dropped from a printed book, a restore writing the wrong rows,
      # four hundred requests where one was promised, a duplicate warning that
      # stopped warning, text quietly too pale to read.
      - name: Checks
        run: npm run checks

      # Needs the build above: it reads what index.html actually pulls in.
      - name: What a first visit downloads
        run: npm run bundle:check

      - uses: actions/upload-artifact@v4
        with:
          name: sample-directory-pdf
          path: /tmp/sample-directory.pdf
          if-no-files-found: error

  # The anon key ships in the browser bundle, so row level security is the only
  # thing keeping the congregation's details private. Prove it every push.
  rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Row level security tests
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
        run: npm run test:rls
